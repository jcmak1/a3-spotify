
<h1>Search Spotify</h1>

<input
  [(ngModel)]="searchString"
  placeholder="Search Spotify"
  (keyup.enter)="search()">

<select [(ngModel)]="searchCategory">
  @for (category of searchCategories; track category) {
    <option [value]="category">
      {{category}}
    </option>
  }
</select>

<button class="btn btn-light" (click)="search()">
  Search
</button>

@if (resources) {
  @if (searchCategory === 'artist' || searchCategory === 'album') {
    <app-carousel
      [resources]="resources"
      carouselId="searchCarousel">
    </app-carousel>
  }

  @if (searchCategory === 'track') {
    <app-track-list
      [tracks]="$any(resources)">
    </app-track-list>
  }
}
